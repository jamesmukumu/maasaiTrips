<header></header>

<!-- create a dynamic form where matLabel will be question then some matCheckbox when the answers is an array but when the array is empty it be a text area  -->

<h1>Kindly Fill out this feedback form</h1>
<form *ngIf="!fetching">
    <div *ngFor="let item of itemsDummy;let i = index">
      <ng-container class="form-container" *ngFor="let key of getQuestionKeys(item)">
        <mat-form-field *ngIf="item.answers.length === 0" appearance="outline" style="width:100%">
          <mat-label>({{ i+1 }})  {{ item[key] }}?</mat-label>
          <textarea matInput></textarea>
        </mat-form-field>
  
        <div *ngIf="item.answers.length > 0">
          <p><strong>({{ (i+1) }} ) {{   item[key]  }}?</strong></p>
          <mat-checkbox required *ngFor="let answer of item.answers">{{ answer }}</mat-checkbox>
        </div>
      </ng-container>
    </div>
    <button class="button-5" role="button" >Submit Feedback</button>
  </form>
  <p *ngIf="fetching">Preparing feedback form,Kindly wait...</p>
