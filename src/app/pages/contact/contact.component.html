<div class="safari-bg">
  <div class="contact-card">
    <div class="contact-container">

      <!-- Contact Form -->
      <div class="contact-form">
        <h2>Send your Enquiry for a Maasai Mara Safari</h2>
        
        <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
          
          <div class="form-group">
            <label for="firstName">Name (Required)</label>
            <input 
              type="text" 
              id="firstName" 
              name="firstName" 
              ngModel 
              required 
              #firstName="ngModel"
              placeholder="John">
            <div class="error" *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)">
              Name is required.
            </div>
          </div>
     
          <div class="form-group">
            <label for="email">Email Address (Required)</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              ngModel 
              required 
              email
              #email="ngModel"
              placeholder="john.doe@example.com">
            <div class="error" *ngIf="email.invalid && (email.dirty || email.touched)">
              Please enter a valid email.
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number (Required)</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              ngModel 
              required 
              pattern="^[0-9\-\+\s\(\)]{7,15}$"
              #phone="ngModel"
              placeholder="+1 (234) 567-8900">
            <div class="error" *ngIf="phone.invalid && (phone.dirty || phone.touched)">
              Please enter a valid phone number.
            </div>
          </div>
       
          <div class="form-group">
            <label for="message">Your Message (Required)</label>
            <textarea 
              id="message" 
              name="message" 
              ngModel 
              required 
              #message="ngModel"
              rows="5" 
              placeholder="Please provide details about your Enquiry..."></textarea>
            <div class="error" *ngIf="message.invalid && (message.dirty || message.touched)">
              Message is required.
            </div>
          </div>
   
          <button class="button-5" *ngIf="!saving" type="submit" >Submit</button>
          <app-buttons *ngIf="saving"></app-buttons>
        </form>
      </div>
    </div>
  </div>
</div>
<p-toast/>
