<section class="container">
    <div class="card-grid">
      <div *ngFor="let off of featureSafaris" class="card" (click)="seeSafari(off.packageSlug)">
        <img
          [src]="off.packageImage"
          alt="{{off.offerName}}"
          class="card-img"
        />
        <h3 class="card-title">{{off.packageTitle}}</h3>
        <p class="card-desc"*ngIf="showOverview"  [innerHTML]="off.packageOverview"></p>
        <div class="card-footer">
          <p class="card-price">
            From   <span class="price-highlight">
                {{off.packageChargeCurrency}} {{ priceFormatter(off.packageCharge) }}
              </span>
          </p>
          
        </div>
         <div class="btn">
          <button class="button-5" (click)="seeSafari(off.packageSlug)" role="button">Explore</button>
         </div>
      </div>
    </div>  
  </section>
