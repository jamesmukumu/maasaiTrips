<h1>Blogs We think You will also Like.</h1>
<div class="container"  *ngFor="let blogs of relatedBlogs">
    <div> 
     <img [src]="blogs.blogThumbnail" [alt]="blogs.blogTitle">
     </div>
     <div class="blog-meta">
         <h1>{{blogs.blogTitle}}</h1>
        
       <!--  -->
         <button class="button-5" role="button" (click)="goBlog(blogs.blogSlug)">Read Blog</button>
         </div>
        </div>
