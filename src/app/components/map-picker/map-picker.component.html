<div style="height: 500px; width: 100%">
    <google-map
      [center]="center"
      [zoom]="zoom"
      height="100%"
      width="100%"
      (mapClick)="moveMap($event)">
      <map-marker *ngFor="let markerPosition of markerPositions" 
                  [position]="markerPosition">
      </map-marker>
    </google-map>
  </div>
