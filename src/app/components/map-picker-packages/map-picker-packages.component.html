<div style="height: 500px; width: 100%">
    <google-map
      [center]="center"
      [zoom]="zoom"
      height="100%"
      width="100%"
      (mapClick)="moveMap($event)">
      
      <map-marker *ngIf="start" [position]="start" label="S"></map-marker>
      <map-marker *ngIf="finish" [position]="finish" label="F"></map-marker>
    </google-map>
  </div>
